services:
  # 1. Backend Engine (Express REST API, Meta Webhooks & Scraper)
  - type: web
    name: jersey-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: GRAPH_API_VERSION
        value: v25.0
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_CONFIG_ID
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        generateValue: true

  # 2. Frontend Store Owner CRM (Vite + React + Tailwind)
  - type: static
    name: jersey-crm
    plan: free
    rootDir: crm
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jersey-backend
          property: host
