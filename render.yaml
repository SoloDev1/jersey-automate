services:
  - type: web
    name: jersey-automate
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: GRAPH_API_VERSION
        value: v25.0
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_CONFIG_ID
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        generateValue: true
